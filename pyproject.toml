[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarswarm"
version = "0.1.0"
description = "Autonomous Multi-Agent AI Scholarship Finder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "groq>=0.13",
    "pymupdf>=1.25",
    "reportlab>=4.2",
    "beautifulsoup4>=4.12",
    "trafilatura>=2.0",
    "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
